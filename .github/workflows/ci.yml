name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write   # for SARIF upload

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Dogfood scan (sprig scans its own sources)
        run: |
          java -jar target/sprig-0.1.0.jar scan . --output sarif --output-file sprig.sarif \
            --exclude-path 'target/**' || true

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sprig.sarif
