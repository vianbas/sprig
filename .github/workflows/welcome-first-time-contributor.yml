# Thanks a contributor on their first merged PR and points them at another
# good-first-issue if one's open. Deliberately minimal compared to some
# projects' onboarding flows: no external form, no extra bot, no dedicated
# PAT — the default GITHUB_TOKEN has everything this needs (comment + label
# in the same repo).
name: Welcome first-time contributor

on:
  pull_request_target:
    types: [closed]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check if this is their first merged PR, then welcome them
        uses: actions/github-script@v7
        with:
          script: |
            const username = context.payload.pull_request.user.login;
            const prNumber = context.payload.pull_request.number;

            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            if (labels.some(l => l.name === 'first-time-contributor')) {
              return; // already welcomed (e.g. workflow re-run)
            }

            const { data: search } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:pr author:${username} is:merged`,
            });
            if (search.total_count !== 1) {
              return; // not their first merged PR
            }

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'good first issue',
              state: 'open',
            });
            const candidates = openIssues.filter(i => !i.assignee);
            const next = candidates.length
              ? candidates[Math.floor(Math.random() * candidates.length)]
              : null;
            const nextIssueBlock = next
              ? `\n\nLooking for what's next? [#${next.number} - ${next.title}](${next.html_url}) is open and unassigned.`
              : '';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `Thanks for the PR, @${username} — this is your first merge into sprig! 🎉${nextIssueBlock}`,
            });

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              labels: ['first-time-contributor'],
            });
