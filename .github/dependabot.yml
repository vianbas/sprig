version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    ignore:
      # Major bumps of any Maven dependency (runtime or test) need a human
      # to actually read the changelog before merging — a pre-1.0 static
      # analysis tool has no business auto-swallowing breaking changes in
      # its parser (javaparser), config loader (snakeyaml), or reporters
      # (jackson). Minor/patch still auto-PR as usual.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    ignore:
      # Same rationale as the maven block above: actions/checkout jumping
      # v4->v7 in one auto-PR (3 major versions, including an explicit
      # BREAKING fork-PR-checkout change) is exactly the case this guards
      # against. `ignore` only affects routine version updates — a real
      # CVE fix still comes through Dependabot security updates regardless
      # of this rule (verified against GitHub's own docs).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
