management:
  endpoints:
    web:
      exposure:
        include: "*"
      cors:
        allowed-origins: "*"
        allow-credentials: true
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/app
    password: super-secret-password
logging:
  level:
    org.springframework.security: DEBUG
server:
  servlet:
    session:
      cookie:
        http-only: false
        secure: false
