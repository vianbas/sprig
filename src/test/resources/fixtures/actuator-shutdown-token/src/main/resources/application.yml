# shutdown named in the exposure list and nothing else. Measured on Boot 2.3.12,
# 3.3.13 and 3.5.16: POST /actuator/shutdown answers 404 in all three, because
# the endpoint ships switched off and exposure does not switch it on. Flagging
# this was a false positive; SPR-CONFIG-006 covers the configuration that does
# reach it.
management:
  endpoints:
    web:
      exposure:
        include: health,info,shutdown
